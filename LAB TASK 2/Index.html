<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004494; }
        #errorMessages { color: #d9534f; margin-bottom: 15px; }
        #attemptCounter { color: #f0ad4e; font-weight: bold; margin-top: 15px; text-align: center; display: none; }
        #successMessage { color: #5cb85c; font-weight: bold; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <h2>Student Login Form</h2>

    <div id="errorMessages"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
        </div>
        
        <button type="submit">Submit</button>
    </form>

    <div id="attemptCounter">Invalid attempts: <span id="countDisplay">0</span></div>
    <div id="successMessage"></div>

    <script src="script.js"></script>
</body>
</html>
