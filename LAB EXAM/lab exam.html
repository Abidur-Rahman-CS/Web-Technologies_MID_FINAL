<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Tech Connect - Event Registration</title>
    <link rel="stylesheet" href="lab exam.css">
</head>
<body>

<div class="container">
    <h2>Event Registration Form</h2>
    
    <form id="registrationForm">
        <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
            <span class="error-message" id="nameError"></span>
        </div>

        <div class="form-group">
            <label for="email">Professional Email *</label>
            <input type="email" id="email" placeholder="Enter your email address">
            <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="company">Company/Institution (Optional)</label>
            <input type="text" id="company" placeholder="Enter your company name">
            <span class="error-message" id="companyError"></span>
        </div>

        <div class="form-group">
            <label>Attendance Type *</label>
            <div class="radio-group">
                <label><input type="radio" name="attendance" value="Virtual"> Virtual</label>
                <label><input type="radio" name="attendance" value="In-Person"> In-Person</label>
            </div>
            <span class="error-message" id="attendanceError"></span>
        </div>

        <button type="submit" class="submit-btn">Register</button>
    </form>

    <hr>

    <button id="analyticsToggleBtn" class="analytics-btn">Show Event Analytics</button>
    
    <div id="statsPanel" class="stats-panel">
        <p>Total Registrants: <span id="totalCount">0</span></p>
        <p>Virtual Attendees: <span id="virtualCount">0</span></p>
        <p>In-Person Attendees: <span id="inPersonCount">0</span></p>
    </div>
</div>

<script src="lab exam.js"></script>

</body>
</html>
