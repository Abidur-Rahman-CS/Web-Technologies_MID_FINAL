<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Information Box</title>

    <!-- CSS File Link (MUST be correct) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Product Information Box</h1>

    <div class="product-box">
        <img src="https://via.placeholder.com/120" alt="Laptop">
        <h2>Laptop</h2>
        <p>Powerful laptop for study and office work.</p>
        <p class="price">$800</p>
        <a href="#">Buy Now</a>
    </div>

    <div class="product-box">
        <img src="https://via.placeholder.com/120" alt="Headphones">
        <h2>Headphones</h2>
        <p>Noise cancelling premium sound headphones.</p>
        <p class="price">$120</p>
        <a href="#">Buy Now</a>
    </div>

    <div class="product-box">
        <img src="https://via.placeholder.com/120" alt="Smartwatch">
        <h2>Smartwatch</h2>
        <p>Smartwatch with health and fitness tracking.</p>
        <p class="price">$150</p>
        <a href="#">Buy Now</a>
    </div>

</body>
</html>
